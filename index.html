<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RANDOM STUDIO - Tile Shooter 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}body{touch-action:none}
#splash{position:fixed;inset:0;background:radial-gradient(circle at center,#062746 0,#00101f 45%,#000 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;cursor:pointer;text-align:center;padding:20px}
.logo{width:min(320px,72vw);height:130px;border:2px solid #00aaff;border-radius:24px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(0,170,255,.2),rgba(0,20,40,.65));box-shadow:0 0 30px #0077aa, inset 0 0 30px rgba(0,170,255,.12);animation:pulse 2s infinite}
.logo b{color:#fff;font-size:clamp(24px,7vw,42px);letter-spacing:6px;text-shadow:0 0 16px #00aaff}
.logo small{display:block;color:#00aaff;letter-spacing:4px;margin-top:6px}
#splash h2{color:#00aaff;letter-spacing:4px;margin:20px 0 8px}
#splash p{color:#fff;margin:5px}.hint{color:#888!important;font-size:12px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
#ui{position:absolute;top:15px;left:15px;color:#fff;z-index:10;background:rgba(0,0,0,.58);padding:10px 15px;border-radius:12px;border:1px solid rgba(0,190,255,.35);backdrop-filter:blur(5px)}
#score{color:#0ff;font-size:22px;font-weight:bold}#status{font-size:12px;color:#aaa;margin-top:3px}
#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#0ff;font-size:30px;z-index:8;pointer-events:none;text-shadow:0 0 8px #00ffff}
#help{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);z-index:10;color:#b9dfff;background:rgba(0,0,0,.5);padding:8px 12px;border-radius:10px;font-size:12px;text-align:center}
#mobile{display:none;position:absolute;inset:auto 0 25px 0;z-index:20;justify-content:space-between;padding:0 20px;pointer-events:none}
.pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);gap:5px;pointer-events:auto}.pad button,#fire{border:1px solid #08c;background:rgba(0,30,55,.72);color:#0ff;border-radius:12px;font-size:20px}
#fire{width:78px;height:78px;border-radius:50%;pointer-events:auto;align-self:end}
canvas{display:block;width:100%;height:100%}
@media(max-width:700px){#help{display:none}#mobile{display:flex}}
</style>
</head>
<body>
<div id="splash" onclick="startGame()">
  <div class="logo"><div><b>RANDOM</b><small>STUDIO</small></div></div>
  <h2>TILE SHOOTER 3D</h2>
  <p>CLICK TO PLAY — WASD + MOUSE + CLICK TO SHOOT</p>
  <p class="hint">Desktop: click to lock mouse • Mobile: use touch controls</p>
  <p class="hint">Powered by RANDOM STUDIO</p>
</div>
<div id="ui"><div id="score">SCORE: 0</div><div id="status">CLICK TO SHOOT</div></div>
<div id="crosshair">⊕</div>
<div id="help">WASD = MOVE &nbsp; • &nbsp; MOUSE = LOOK &nbsp; • &nbsp; CLICK = SHOOT &nbsp; • &nbsp; ESC = PAUSE</div>
<div id="mobile">
  <div class="pad">
    <span></span><button data-key="w">▲</button><span></span>
    <button data-key="a">◀</button><button data-key="s">▼</button><button data-key="d">▶</button>
  </div>
  <button id="fire">FIRE</button>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x051525);
scene.fog=new THREE.Fog(0x051525,18,55);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1000);
camera.position.set(0,1.7,8);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.domElement.id='game';
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x99ddff,0x06101c,1.4));
const sun=new THREE.DirectionalLight(0xffffff,1.4);sun.position.set(5,12,5);scene.add(sun);

const floor=new THREE.Mesh(
 new THREE.PlaneGeometry(80,80),
 new THREE.MeshStandardMaterial({color:0x081b2b,roughness:.8,metalness:.15})
);
floor.rotation.x=-Math.PI/2;scene.add(floor);
const grid=new THREE.GridHelper(80,40,0x087aa8,0x123246);grid.position.y=.01;scene.add(grid);

const arena=new THREE.Mesh(
 new THREE.BoxGeometry(50,.5,50),
 new THREE.MeshStandardMaterial({color:0x071522,roughness:1})
);
arena.position.y=-.3;scene.add(arena);

for(let i=0;i<4;i++){
 const wall=new THREE.Mesh(new THREE.BoxGeometry(i%2?50:.5,5,i%2?.5:50),new THREE.MeshStandardMaterial({color:0x08263a,emissive:0x00182a}));
 wall.position.set(i===1?25:i===3?-25:0,2.5,i===0?-25:i===2?25:0);scene.add(wall);
}

const targets=[];
const targetGeo=new THREE.BoxGeometry(1.35,1.35,.35);
const colors=[0xff247f,0x00d9ff,0xffb000,0x66ff55,0xaa66ff];

function spawnTarget(){
 const m=new THREE.MeshStandardMaterial({color:colors[Math.floor(Math.random()*colors.length)],emissive:0x111111,roughness:.35,metalness:.35});
 const t=new THREE.Mesh(targetGeo,m);
 let x=(Math.random()*34)-17,z=(Math.random()*30)-12;
 const dist=Math.hypot(x-camera.position.x,z-camera.position.z);
 if(dist<7) z-=10;
 t.position.set(x,1+Math.random()*5,z);
 t.rotation.y=Math.random()*Math.PI;
 t.userData.baseY=t.position.y;
 t.userData.phase=Math.random()*Math.PI*2;
 scene.add(t);targets.push(t);
}
for(let i=0;i<10;i++)spawnTarget();

let score=0,locked=false,started=false;
const move={w:false,a:false,s:false,d:false};
let yaw=0,pitch=0;
const raycaster=new THREE.Raycaster();

function updateScore(){document.getElementById('score').textContent='SCORE: '+score}
function shoot(){
 if(!started)return;
 raycaster.setFromCamera(new THREE.Vector2(0,0),camera);
 const hits=raycaster.intersectObjects(targets,false);
 if(hits.length){
   const t=hits[0].object;
   scene.remove(t);targets.splice(targets.indexOf(t),1);
   score+=10;updateScore();spawnTarget();
   document.getElementById('status').textContent='HIT! +10';
 }else document.getElementById('status').textContent='MISS';
}

function lockPointer(){renderer.domElement.requestPointerLock?.()}
window.startGame=()=>{document.getElementById('splash').style.display='none';started=true;lockPointer();document.getElementById('status').textContent='GAME ON'}
renderer.domElement.addEventListener('click',()=>{if(started&&!locked)lockPointer();else if(started&&locked)shoot()});
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===renderer.domElement;document.getElementById('status').textContent=locked?'GAME ON':'PAUSED — CLICK TO CONTINUE'});

document.addEventListener('mousemove',e=>{
 if(!locked)return;
 yaw-=e.movementX*.0025;
 pitch-=e.movementY*.0025;
 pitch=Math.max(-1.45,Math.min(1.45,pitch));
 camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;
});
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k in move)move[k]=true});
document.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k in move)move[k]=false});

document.querySelectorAll('[data-key]').forEach(btn=>{
 const k=btn.dataset.key;
 const on=e=>{e.preventDefault();move[k]=true};
 const off=e=>{e.preventDefault();move[k]=false};
 btn.addEventListener('touchstart',on,{passive:false});btn.addEventListener('touchend',off,{passive:false});btn.addEventListener('touchcancel',off,{passive:false});
});
document.getElementById('fire').addEventListener('touchstart',e=>{e.preventDefault();shoot()},{passive:false});

const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);
 if(started&&locked){
   const dir=new THREE.Vector3();
   if(move.w)dir.z-=1;if(move.s)dir.z+=1;if(move.a)dir.x-=1;if(move.d)dir.x+=1;
   if(dir.lengthSq()){dir.normalize();dir.applyAxisAngle(new THREE.Vector3(0,1,0),yaw);camera.position.addScaledVector(dir,7*dt)}
   camera.position.x=Math.max(-22,Math.min(22,camera.position.x));
   camera.position.z=Math.max(-22,Math.min(22,camera.position.z));
 }
 targets.forEach((t,i)=>{t.position.y=t.userData.baseY+Math.sin(performance.now()*.0015+t.userData.phase)*.25;t.rotation.z+=dt*.45;t.rotation.y+=dt*.25});
 renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
