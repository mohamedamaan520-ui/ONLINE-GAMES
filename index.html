<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Free browser games - play instantly on PC and mobile.">
<title>ONLINE GAMES — Free Browser Games</title>
<style>
:root{--bg:#07101f;--panel:#0d1930;--card:#101f3b;--text:#f6f8ff;--muted:#9eacc5;--accent:#6c63ff;--accent2:#00d4ff;--border:#203252}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#172758 0,#07101f 42%,#040914 100%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer;border:0}
header{padding:28px 18px 18px;max-width:1180px;margin:auto}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.brand{font-size:28px;font-weight:900;letter-spacing:.5px}.brand span{color:#00d4ff}.tag{color:var(--muted);margin:5px 0 20px}.search{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:12px 15px;border-radius:14px;width:min(300px,100%)}
nav{display:flex;gap:9px;overflow:auto;padding-bottom:5px}nav button,.filter{background:var(--panel);color:var(--muted);padding:10px 14px;border-radius:999px;border:1px solid var(--border)}nav button.active,nav button:hover{background:var(--accent);color:white}
main{max-width:1180px;margin:auto;padding:10px 18px 45px}.hero{background:linear-gradient(135deg,rgba(108,99,255,.22),rgba(0,212,255,.1));border:1px solid var(--border);border-radius:24px;padding:25px;margin:12px 0 25px}.hero h1{font-size:clamp(28px,5vw,48px);margin:0 0 8px}.hero p{color:var(--muted);margin:0}.ad{min-height:78px;border:1px dashed #334766;border-radius:14px;display:grid;place-items:center;color:#71809b;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.card{background:linear-gradient(180deg,#122340,#0c172b);border:1px solid var(--border);border-radius:20px;padding:18px;transition:.2s}.card:hover{transform:translateY(-3px);border-color:#465f91}.thumb{height:125px;border-radius:15px;display:grid;place-items:center;font-size:52px;background:linear-gradient(135deg,#182b52,#0a1325);margin-bottom:15px}.card h3{margin:0 0 5px}.card p{color:var(--muted);min-height:42px}.play{width:100%;padding:11px;border-radius:12px;background:var(--accent);color:white;font-weight:800}.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:15px;z-index:10}.modal.open{display:flex}.box{width:min(720px,100%);max-height:92vh;overflow:auto;background:#091426;border:1px solid #294062;border-radius:22px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{background:#1a2942;color:white;border-radius:10px;padding:8px 12px}.game{margin-top:15px}.scorebar{display:flex;justify-content:space-between;background:#101f38;padding:10px 12px;border-radius:12px;margin-bottom:12px}.game canvas{display:block;width:100%;max-width:600px;margin:auto;background:#020712;border-radius:15px;border:1px solid #263a5b}.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}.controls button{background:#172846;color:white;padding:11px 16px;border-radius:11px}.tic{display:grid;grid-template-columns:repeat(3,80px);gap:7px;justify-content:center}.tic button{height:80px;background:#132541;color:white;border-radius:12px;font-size:30px}.memory{display:grid;grid-template-columns:repeat(4,70px);gap:8px;justify-content:center}.memory button{height:70px;border-radius:10px;background:#162946;color:transparent;font-size:25px}.memory button.show{color:white;background:#253e67}.reaction{height:190px;border-radius:18px;background:#15253e;display:grid;place-items:center;font-size:24px;font-weight:800;text-align:center}.reaction.go{background:#116b45}.small{color:var(--muted);font-size:13px}@media(max-width:600px){.top{align-items:flex-start;flex-direction:column}.search{width:100%}.tic{grid-template-columns:repeat(3,72px)}.tic button{height:72px}.memory{grid-template-columns:repeat(4,62px)}.memory button{height:62px}}
</style>
</head>
<body>
<header>
 <div class="top"><div><div class="brand">🎮 ONLINE<span>-GAMES</span></div><div class="tag">Free games. No download. Play instantly.</div></div><input id="search" class="search" placeholder="Search games..."></div>
 <nav id="nav"><button class="active" data-cat="all">All Games</button><button data-cat="arcade">Arcade</button><button data-cat="classic">Classic</button><button data-cat="puzzle">Puzzle</button><button data-cat="reaction">Reaction</button></nav>
</header>
<main>
 <section class="hero"><h1>Play Free Games 🎮</h1><p>Pick a game and start playing instantly on your phone or computer.</p></section>
 <div class="ad">ADVERTISEMENT — AdSense ready space</div>
 <section id="grid" class="grid"></section>
 <div class="ad">ADVERTISEMENT — AdSense ready space</div>
</main>
<div id="modal" class="modal"><div class="box"><div class="modalhead"><h2 id="title">Game</h2><button class="close" id="close">✕</button></div><div id="game" class="game"></div></div></div>
<script>
const games=[
{id:'snake',name:'Snake',cat:'arcade',icon:'🐍',desc:'Eat the food and grow without hitting the wall.'},
{id:'breakout',name:'Brick Breaker',cat:'arcade',icon:'🧱',desc:'Break every brick with your paddle.'},
{id:'memory',name:'Memory Match',cat:'puzzle',icon:'🧠',desc:'Find all matching pairs as quickly as possible.'},
{id:'tictactoe',name:'Tic Tac Toe',cat:'classic',icon:'⭕',desc:'Classic 3×3 game. Play against the computer.'},
{id:'reaction',name:'Reaction Test',cat:'reaction',icon:'⚡',desc:'Wait for green, then click as fast as you can.'},
{id:'clicker',name:'Fast Clicker',cat:'reaction',icon:'👆',desc:'How many clicks can you make in 10 seconds?'}
];
const grid=document.querySelector('#grid'),search=document.querySelector('#search'),modal=document.querySelector('#modal'),gameEl=document.querySelector('#game'),title=document.querySelector('#title');
function render(){let q=search.value.toLowerCase(),cat=document.querySelector('nav .active').dataset.cat;grid.innerHTML=games.filter(g=>(cat==='all'||g.cat===cat)&&g.name.toLowerCase().includes(q)).map(g=>`<article class="card"><div class="thumb">${g.icon}</div><h3>${g.name}</h3><p>${g.desc}</p><button class="play" data-id="${g.id}">PLAY NOW ▶</button></article>`).join('')||'<p>No games found.</p>'}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});search.oninput=render;
grid.onclick=e=>{let b=e.target.closest('[data-id]');if(b)openGame(b.dataset.id)};document.querySelector('#close').onclick=closeGame;modal.onclick=e=>{if(e.target===modal)closeGame()};
function openGame(id){let g=games.find(x=>x.id===id);title.textContent=g.icon+' '+g.name;modal.classList.add('open');gameEl.innerHTML='';({snake,breakout,memory,tictactoe,reaction,clicker}[id])()}
function closeGame(){modal.classList.remove('open');gameEl.innerHTML=''}
function bar(score=0,text='Score'){gameEl.innerHTML='<div class="scorebar"><b>'+text+'</b><b id="score">'+score+'</b></div><div id="board"></div>';return document.querySelector('#board')}
function snake(){let b=bar(0,'Score');b.innerHTML='<canvas id="c" width="560" height="360"></canvas><div class="controls"><button id="start">Start / Restart</button><span class="small">Use arrow keys or WASD</span></div>';let c=document.querySelector('#c'),x=c.getContext('2d'),s=20,snake=[{x:9,y:9}],food={x:14,y:8},dx=1,dy=0,timer=null,score=0;function foodNew(){food={x:Math.floor(Math.random()*28),y:Math.floor(Math.random()*18)}}function draw(){x.fillStyle='#020712';x.fillRect(0,0,c.width,c.height);x.fillStyle='#ff5c7a';x.fillRect(food.x*s,food.y*s,s-2,s-2);x.fillStyle='#00d4ff';snake.forEach(p=>x.fillRect(p.x*s,p.y*s,s-2,s-2))}function step(){let h={x:snake[0].x+dx,y:snake[0].y+dy};if(h.x<0||h.y<0||h.x>=28||h.y>=18||snake.some(p=>p.x===h.x&&p.y===h.y)){clearInterval(timer);return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;document.querySelector('#score').textContent=score;foodNew()}else snake.pop();draw()}document.querySelector('#start').onclick=()=>{clearInterval(timer);snake=[{x:9,y:9}];dx=1;dy=0;score=0;document.querySelector('#score').textContent=0;foodNew();draw();timer=setInterval(step,105)};document.onkeydown=e=>{if(!modal.classList.contains('open'))return;let k=e.key.toLowerCase();if(k==='arrowup'||k==='w'){if(dy!==1)dx=0,dy=-1}if(k==='arrowdown'||k==='s'){if(dy!==-1)dx=0,dy=1}if(k==='arrowleft'||k==='a'){if(dx!==1)dx=-1,dy=0}if(k==='arrowright'||k==='d'){if(dx!==-1)dx=1,dy=0}}draw()}
function breakout(){let b=bar(0,'Score'),c=document.createElement('canvas');c.width=560;c.height=360;b.append(c);let x=c.getContext('2d'),p={x:250,w:70},ball={x:280,y:300,dx:3,dy:-3},bricks=Array.from({length:35},(_,i)=>({x:(i%7)*78+8,y:35+Math.floor(i/7)*24,on:1})),run=0,score=0;function draw(){x.fillStyle='#020712';x.fillRect(0,0,560,360);x.fillStyle='#6c63ff';bricks.forEach(r=>r.on&&x.fillRect(r.x,r.y,70,18));x.fillStyle='#00d4ff';x.fillRect(p.x,335,p.w,10);x.beginPath();x.arc(ball.x,ball.y,7,0,7);x.fill()}function step(){if(!run)return;ball.x+=ball.dx;ball.y+=ball.dy;if(ball.x<7||ball.x>553)ball.dx*=-1;if(ball.y<7)ball.dy*=-1;if(ball.y>328&&ball.x>p.x&&ball.x<p.x+p.w)ball.dy=-Math.abs(ball.dy);bricks.forEach(r=>{if(r.on&&ball.x>r.x&&ball.x<r.x+70&&ball.y>r.y&&ball.y<r.y+18){r.on=0;ball.dy*=-1;score++;document.querySelector('#score').textContent=score}});if(ball.y>360){run=0;alert('Game over! Score: '+score)}draw();requestAnimationFrame(step)}b.innerHTML+='<div class="controls"><button id="go">Start</button><button id="left">◀</button><button id="right">▶</button></div>';document.querySelector('#go').onclick=()=>{if(!run){run=1;requestAnimationFrame(step)}};document.querySelector('#left').onclick=()=>p.x=Math.max(0,p.x-45);document.querySelector('#right').onclick=()=>p.x=Math.min(490,p.x+45);c.onmousemove=e=>{let r=c.getBoundingClientRect();p.x=Math.max(0,Math.min(490,(e.clientX-r.left)*560/r.width-p.w/2))};draw()}
function memory(){let b=bar(0,'Moves'),vals=['🍎','🍎','🚀','🚀','⭐','⭐','🐱','🐱','⚽','⚽','🔥','🔥','🎯','🎯','👾','👾'].sort(()=>Math.random()-.5),open=[],moves=0;b.innerHTML='<div class="memory" id="mem"></div>';let m=document.querySelector('#mem');vals.forEach((v,i)=>{let q=document.createElement('button');q.textContent=v;q.dataset.v=v;q.onclick=()=>{if(q.classList.contains('show')||open.length===2)return;q.classList.add('show');open.push(q);if(open.length===2){moves++;document.querySelector('#score').textContent=moves;if(open[0].dataset.v===open[1].dataset.v){open=[]}else setTimeout(()=>{open.forEach(z=>z.classList.remove('show'));open=[]},550)}};m.append(q)})}
function tictactoe(){let b=bar(0,'Your wins'),board=Array(9).fill('');b.innerHTML='<div class="tic" id="tic"></div><div class="controls"><button id="reset">New Game</button></div>';let t=document.querySelector('#tic');function render(){t.innerHTML='';board.forEach((v,i)=>{let q=document.createElement('button');q.textContent=v;q.onclick=()=>move(i);t.append(q)})}function win(a){return [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(r=>r.every(i=>a[i]))&&new Set(r=>r)}function winner(){for(let r of [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]])if(board[r[0]]&&board[r[0]]===board[r[1]]&&board[r[1]]===board[r[2]])return board[r[0]];return board.every(Boolean)?'draw':null}function move(i){if(board[i])return;board[i]='X';let w=winner();if(w){finish(w);return}let empty=board.map((v,j)=>v?null:j).filter(v=>v!==null);if(empty.length){let j=empty[Math.floor(Math.random()*empty.length)];board[j]='O'}w=winner();if(w)finish(w);render()}function finish(w){if(w==='X'){let n=+(document.querySelector('#score').textContent)||0;document.querySelector('#score').textContent=n+1}setTimeout(()=>alert(w==='draw'?'Draw!':w+' wins!'),50)}document.querySelector('#reset').onclick=()=>{board=Array(9).fill('');render()};render()}
function reaction(){let b=bar(0,'Best ms'),r=document.createElement('div');r.className='reaction';r.textContent='Click START, then wait for GREEN';b.append(r);let start=0,timer=null,ready=false,go=document.createElement('button');go.textContent='Start';go.className='controls';go.onclick=()=>{clearTimeout(timer);ready=false;r.className='reaction';r.textContent='Wait...';timer=setTimeout(()=>{ready=true;start=performance.now();r.className='reaction go';r.textContent='CLICK!'},1000+Math.random()*3000)};r.onclick=()=>{if(ready){let ms=Math.round(performance.now()-start);r.className='reaction';r.textContent=ms+' ms — '+(ms<250?'Excellent!':'Try again!');document.querySelector('#score').textContent=ms;ready=false}else if(start){r.textContent='Too soon! Press Start.'}};b.append(go)}
function clicker(){let b=bar(0,'Clicks'),area=document.createElement('div');area.className='reaction';area.textContent='START';b.append(area);let running=false,n=0,end=0;area.onclick=()=>{if(!running){running=true;n=0;end=Date.now()+10000;area.textContent='CLICK!';let tick=setInterval(()=>{let left=Math.max(0,end-Date.now());area.textContent='CLICK! '+(left/1000).toFixed(1)+'s';if(left<=0){clearInterval(tick);running=false;area.textContent='TIME! '+n+' clicks';document.querySelector('#score').textContent=n}},100)}else{n++;document.querySelector('#score').textContent=n}}}
render();
</script>
</body>
</html>
