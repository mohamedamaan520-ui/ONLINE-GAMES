<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RANDOM STUDIO - Tile Shooter 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}body{touch-action:none}
#splash{position:fixed;inset:0;background:radial-gradient(circle at center,#062746 0,#00101f 45%,#000 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;cursor:pointer;text-align:center;padding:20px}
.logo{width:min(320px,72vw);height:130px;border:2px solid #00aaff;border-radius:24px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(0,170,255,.2),rgba(0,20,40,.65));box-shadow:0 0 30px #0077aa,inset 0 0 30px rgba(0,170,255,.12);animation:pulse 2s infinite}.logo b{color:#fff;font-size:clamp(24px,7vw,42px);letter-spacing:6px;text-shadow:0 0 16px #00aaff}.logo small{display:block;color:#00aaff;letter-spacing:4px;margin-top:6px}
#splash h2{color:#00aaff;letter-spacing:4px;margin:20px 0 8px}#splash p{color:#fff;margin:5px}.hint{color:#888!important;font-size:12px}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
#ui{position:absolute;top:15px;left:15px;color:#fff;z-index:20;background:rgba(0,0,0,.62);padding:10px 15px;border-radius:12px;border:1px solid rgba(0,190,255,.35);backdrop-filter:blur(5px);min-width:190px}
#score{color:#0ff;font-size:22px;font-weight:bold}#wave{color:#fff;font-size:13px;margin-top:3px}#status{font-size:12px;color:#aaa;margin-top:3px}
#healthWrap{margin-top:8px;height:14px;background:#260b10;border-radius:10px;overflow:hidden;border:1px solid #55202a}.health{height:100%;width:100%;background:linear-gradient(90deg,#ff2020,#ff7a00);transition:width .2s}
#crosshair{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#0ff;font-size:30px;z-index:18;pointer-events:none;text-shadow:0 0 8px #00ffff}
#damage{position:absolute;inset:0;z-index:17;pointer-events:none;background:rgba(255,0,0,0);transition:background .08s}.hitmark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:40px;opacity:0;pointer-events:none;z-index:19}.hitmark.show{animation:hit .18s}@keyframes hit{0%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(.7)}}
#weapon{position:absolute;right:5%;bottom:-5%;width:330px;height:270px;z-index:16;pointer-events:none;transform-origin:80% 90%;transition:transform .06s}
#gunBody{position:absolute;right:35px;bottom:95px;width:220px;height:58px;background:linear-gradient(180deg,#454b53,#12161b 55%,#07090b);border-radius:12px 45px 12px 10px;box-shadow:inset 0 5px 8px #69727b,0 10px 18px #000;transform:rotate(-8deg)}
#barrel{position:absolute;right:0;bottom:136px;width:115px;height:20px;background:linear-gradient(#525960,#11151a);border-radius:3px 16px 16px 3px;transform:rotate(-8deg);box-shadow:inset 0 3px 3px #89929a}
#scope{position:absolute;right:105px;bottom:157px;width:72px;height:20px;border-radius:7px;background:#11161b;border:2px solid #59616a;transform:rotate(-8deg)}#grip{position:absolute;right:105px;bottom:28px;width:58px;height:110px;background:linear-gradient(90deg,#171b20,#343a40,#0a0d10);border-radius:8px 8px 18px 18px;transform:rotate(10deg)}#mag{position:absolute;right:190px;bottom:40px;width:38px;height:105px;background:linear-gradient(90deg,#15191d,#3b4249,#0b0d10);border-radius:4px 4px 15px 15px;transform:rotate(12deg)}
#muzzle{position:absolute;right:-14px;bottom:133px;font-size:52px;opacity:0;color:#ffd43b;filter:drop-shadow(0 0 14px #ff6a00)}#muzzle.fire{animation:muzzle .08s}@keyframes muzzle{0%{opacity:1;transform:scale(1.4)}100%{opacity:0;transform:scale(.7)}}
#help{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);z-index:20;color:#b9dfff;background:rgba(0,0,0,.5);padding:8px 12px;border-radius:10px;font-size:12px;text-align:center}
#mobile{display:none;position:absolute;inset:auto 0 25px 0;z-index:25;justify-content:space-between;padding:0 20px;pointer-events:none}.pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);gap:5px;pointer-events:auto}.pad button,#fire{border:1px solid #08c;background:rgba(0,30,55,.75);color:#0ff;border-radius:12px;font-size:20px}#fire{width:78px;height:78px;border-radius:50%;pointer-events:auto;align-self:end}
#gameover{display:none;position:fixed;inset:0;z-index:998;background:rgba(0,0,0,.82);align-items:center;justify-content:center;text-align:center;color:white}.overbox{padding:35px 25px;border:1px solid #0af;border-radius:20px;background:#061523;box-shadow:0 0 35px #003b5c}.overbox h1{color:#ff3333;letter-spacing:4px}.restart{padding:13px 22px;border:0;border-radius:10px;background:#008ed4;color:#fff;font-weight:bold;cursor:pointer}
canvas{display:block;width:100%;height:100%}@media(max-width:700px){#help{display:none}#mobile{display:flex}#weapon{transform:scale(.65);right:-55px;bottom:-45px}}

/* AAA-style presentation polish */
#game{filter:saturate(1.08) contrast(1.04)}
#damage{mix-blend-mode:screen}
#crosshair{font-size:34px;font-weight:300;text-shadow:0 0 4px #fff,0 0 14px #00eaff}
#ui{box-shadow:0 12px 40px rgba(0,0,0,.45),inset 0 0 24px rgba(0,170,255,.05)}
#weapon{filter:drop-shadow(0 20px 22px rgba(0,0,0,.75))}
</style>
</head>
<body>
<div id="splash">
  <div class="logo"><div><b>RANDOM</b><small>STUDIO</small></div></div>
  <h2>TILE SHOOTER 3D</h2>
  <p>CLICK TO PLAY — WASD + MOUSE + CLICK TO SHOOT</p>
  <p class="hint">Shoot enemies • Protect your life • Survive every wave</p>
  <p class="hint">Powered by RANDOM STUDIO</p>
</div>
<div id="ui">
  <div id="score">SCORE: 0</div><div id="wave">WAVE: 1</div><div id="status">CLICK TO PLAY</div>
  <div id="healthWrap"><div id="health" class="health"></div></div>
  <div style="font-size:11px;color:#aaa;margin-top:3px">LIFE <span id="hpText">100</span>/100</div>
</div>
<div id="crosshair">⊕</div><div id="damage"></div><div id="hitmark" class="hitmark">✦</div>
<div id="weapon"><div id="gunBody"></div><div id="barrel"></div><div id="scope"></div><div id="grip"></div><div id="mag"></div><div id="muzzle">✦</div></div>
<div id="help">WASD = MOVE • MOUSE = LOOK • CLICK = SHOOT • ESC = PAUSE</div>
<div id="mobile"><div class="pad"><span></span><button data-key="w">▲</button><span></span><button data-key="a">◀</button><button data-key="s">▼</button><button data-key="d">▶</button></div><button id="fire">FIRE</button></div>
<div id="gameover"><div class="overbox"><h1>YOU DIED</h1><p id="finalScore">SCORE: 0</p><p id="finalWave">WAVE: 1</p><button class="restart" id="restart">PLAY AGAIN</button></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

const scene=new THREE.Scene();scene.background=new THREE.Color(0x04111d);scene.fog=new THREE.Fog(0x04111d,15,58);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1000);camera.position.set(0,1.7,10);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.18;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.domElement.id='game';
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0x9bdcff,0x050a10,1.45));
const sun=new THREE.DirectionalLight(0xffffff,2.15);
sun.position.set(8,16,10);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-30;sun.shadow.camera.right=30;sun.shadow.camera.top=30;sun.shadow.camera.bottom=-30;
scene.add(sun);
const rim=new THREE.DirectionalLight(0x159cff,1.8);rim.position.set(-14,7,-10);scene.add(rim);
const redLight=new THREE.PointLight(0xff1838,3.2,18);redLight.position.set(0,3,-16);scene.add(redLight);

const floor=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshStandardMaterial({color:0x081b2b,roughness:.72,metalness:.25}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const arenaGlow=new THREE.Mesh(new THREE.CircleGeometry(13,64),new THREE.MeshBasicMaterial({color:0x063d58,transparent:true,opacity:.16}));
arenaGlow.rotation.x=-Math.PI/2;arenaGlow.position.y=.025;scene.add(arenaGlow);
const grid=new THREE.GridHelper(80,80,0x0aa9d8,0x123246);grid.position.y=.012;grid.material.opacity=.42;grid.material.transparent=true;scene.add(grid);
for(let i=0;i<4;i++){const wall=new THREE.Mesh(new THREE.BoxGeometry(i%2?50:.5,5,i%2?.5:50),new THREE.MeshStandardMaterial({color:0x08263a,emissive:0x00182a}));wall.position.set(i===1?25:i===3?-25:0,2.5,i===0?-25:i===2?25:0);scene.add(wall)}

const enemies=[];const tracers=[];const particles=[];
let score=0,hp=100,wave=1,started=false,locked=false,gameOver=false,yaw=0,pitch=0,lastDamage=0,spawnTimer=0,killsInWave=0;
const tmpV=new THREE.Vector3();
const move={w:false,a:false,s:false,d:false};const raycaster=new THREE.Raycaster();const clock=new THREE.Clock();

function makeEnemy(){
 const root=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(1.05,1.5,.65),new THREE.MeshStandardMaterial({color:0x9b2028,roughness:.65,metalness:.2}));
 body.position.y=1.15;body.castShadow=true;body.receiveShadow=true;root.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.43,16,12),new THREE.MeshStandardMaterial({color:0x30343a,roughness:.55,metalness:.5}));
 head.position.y=2.2;head.castShadow=true;root.add(head);
 const eyeMat=new THREE.MeshStandardMaterial({color:0xff2020,emissive:0x880000});
 for(const x of [-.16,.16]){const eye=new THREE.Mesh(new THREE.SphereGeometry(.07,8,8),eyeMat);eye.position.set(x,2.24,.39);root.add(eye)}
 for(const x of [-.72,.72]){const arm=new THREE.Mesh(new THREE.BoxGeometry(.28,1.15,.32),new THREE.MeshStandardMaterial({color:0x252a30,metalness:.45}));arm.position.set(x,1.1,0);arm.castShadow=true;root.add(arm)}
 const gun=new THREE.Mesh(new THREE.BoxGeometry(.18,.18,.9),new THREE.MeshStandardMaterial({color:0x090b0e,metalness:.8,roughness:.25}));gun.position.set(0.0,1.05,.52);gun.rotation.x=Math.PI/2;gun.castShadow=true;root.add(gun);
 for(const x of [-.3,.3]){const leg=new THREE.Mesh(new THREE.BoxGeometry(.3,1.1,.38),new THREE.MeshStandardMaterial({color:0x15191d,metalness:.4}));leg.position.set(x,.05,0);leg.castShadow=true;root.add(leg)}
 let x,z;do{x=Math.random()*38-19;z=Math.random()*34-17}while(Math.hypot(x-camera.position.x,z-camera.position.z)<12);
 root.position.set(x,0,z);root.userData={hp:2+Math.floor(wave/4),maxHp:2+Math.floor(wave/4),speed:.65+wave*.055,phase:Math.random()*6.28,attack:Math.random()*1.5+1.4};
 scene.add(root);enemies.push(root);
const ring=new THREE.Mesh(new THREE.RingGeometry(.62,.7,32),new THREE.MeshBasicMaterial({color:0xff1735,transparent:true,opacity:.7,side:THREE.DoubleSide}));
ring.rotation.x=-Math.PI/2;ring.position.y=.025;root.add(ring);
const bar=new THREE.Mesh(new THREE.PlaneGeometry(1.25,.1),new THREE.MeshBasicMaterial({color:0x24ff68}));
bar.position.set(0,2.8,0);bar.userData.isHealth=true;root.add(bar);
}
function spawnWave(){const count=Math.min(4+wave*2,22);for(let i=0;i<count;i++)setTimeout(()=>{if(!gameOver)makeEnemy()},i*350)}
function updateUI(){document.getElementById('score').textContent='SCORE: '+score;document.getElementById('wave').textContent='WAVE: '+wave;document.getElementById('hpText').textContent=Math.max(0,Math.ceil(hp));document.getElementById('health').style.width=Math.max(0,hp)+'%'}
function damage(n){
 if(gameOver)return;hp-=n;lastDamage=performance.now();updateUI();
 const d=document.getElementById('damage');d.style.background='rgba(255,0,0,.38)';setTimeout(()=>d.style.background='rgba(255,0,0,0)',90);
 if(hp<=0)die();
}
function die(){gameOver=true;locked=false;document.exitPointerLock?.();document.getElementById('status').textContent='YOU DIED';document.getElementById('finalScore').textContent='SCORE: '+score;document.getElementById('finalWave').textContent='WAVE: '+wave;document.getElementById('gameover').style.display='flex'}
function reset(){
 enemies.forEach(e=>scene.remove(e));enemies.length=0;score=0;hp=100;wave=1;killsInWave=0;gameOver=false;started=true;updateUI();document.getElementById('gameover').style.display='none';document.getElementById('splash').style.display='none';spawnWave();lockPointer()
}
function start(){if(started&&!gameOver)return;started=true;document.getElementById('splash').style.display='none';spawnWave();updateUI();lockPointer()}
document.getElementById('splash').addEventListener('click',start);document.getElementById('restart').addEventListener('click',reset);

function audio(freq=180,dur=.05,type='square'){
 try{const A=new AudioContext();const o=A.createOscillator(),g=A.createGain();o.type=type;o.frequency.value=freq;g.gain.value=.035;o.connect(g);g.connect(A.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,A.currentTime+dur);o.stop(A.currentTime+dur);setTimeout(()=>A.close(),dur*1000+40)}catch(e){}
}
function spawnBurst(pos,color=0x7eeaff,count=10){
 for(let i=0;i<count;i++){
  const m=new THREE.Mesh(new THREE.SphereGeometry(.025+Math.random()*.035,6,6),new THREE.MeshBasicMaterial({color,transparent:true}));
  m.position.copy(pos);m.userData.life=.25+Math.random()*.35;m.userData.vel=new THREE.Vector3((Math.random()-.5)*4,Math.random()*3,(Math.random()-.5)*4);
  scene.add(m);particles.push(m);
 }
}
function shoot(){
 if(!started||gameOver||!locked)return;
 const gun=document.getElementById('weapon');gun.style.transform='translate(-8px,8px) rotate(-2deg)';setTimeout(()=>gun.style.transform='',70);
 const mz=document.getElementById('muzzle');mz.classList.remove('fire');void mz.offsetWidth;mz.classList.add('fire');audio(110,.07,'sawtooth');
 raycaster.setFromCamera(new THREE.Vector2(0,0),camera);
 const hits=raycaster.intersectObjects(enemies.flatMap(e=>e.children),false);
 if(!hits.length){document.getElementById('status').textContent='MISS';return}
 const e=hits[0].object.parent;
const hitPoint=hits[0].point.clone();
spawnBurst(hitPoint,0xffc857,7);
const eBar=e.children.find(x=>x.userData.isHealth);
e.userData.hp--;if(eBar)eBar.scale.x=Math.max(0,e.userData.hp/e.userData.maxHp);document.getElementById('hitmark').classList.remove('show');void document.getElementById('hitmark').offsetWidth;document.getElementById('hitmark').classList.add('show');
 if(e.userData.hp<=0){spawnBurst(e.position.clone().add(new THREE.Vector3(0,1.2,0)),0xff4050,22);scene.remove(e);enemies.splice(enemies.indexOf(e),1);score+=10;killsInWave++;audio(70,.12,'triangle');document.getElementById('status').textContent='ENEMY DOWN +10';if(killsInWave>=Math.min(4+wave*2,22)){wave++;killsInWave=0;document.getElementById('status').textContent='WAVE '+wave;spawnWave()}}else{score+=3;document.getElementById('status').textContent='HIT - 3';audio(250,.04)}updateUI()
}
function lockPointer(){renderer.domElement.requestPointerLock?.()}
renderer.domElement.addEventListener('click',()=>{if(started&&!locked&&!gameOver)lockPointer();else if(started&&locked)shoot()});
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===renderer.domElement;if(started&&!gameOver)document.getElementById('status').textContent=locked?'GAME ON':'PAUSED — CLICK TO CONTINUE'});
document.addEventListener('mousemove',e=>{if(!locked)return;yaw-=e.movementX*.0025;pitch-=e.movementY*.0025;pitch=Math.max(-1.42,Math.min(1.42,pitch));camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch});
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k in move)move[k]=true;if(k==='r'&&gameOver)reset()});
document.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k in move)move[k]=false});

document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const on=e=>{e.preventDefault();move[k]=true};const off=e=>{e.preventDefault();move[k]=false};b.addEventListener('touchstart',on,{passive:false});b.addEventListener('touchend',off,{passive:false});b.addEventListener('touchcancel',off,{passive:false})});
document.getElementById('fire').addEventListener('touchstart',e=>{e.preventDefault();if(!started)start();else{if(!locked)lockPointer();shoot()}},{passive:false});

function updateEnemies(dt){
 for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];const dx=camera.position.x-e.position.x,dz=camera.position.z-e.position.z,dist=Math.hypot(dx,dz);
  if(dist>1.65){e.position.x+=dx/dist*e.userData.speed*dt;e.position.z+=dz/dist*e.userData.speed*dt;e.rotation.y=Math.atan2(dx,dz)}
  e.position.y=Math.sin(performance.now()*.005+e.userData.phase)*.035;
 const hpBar=e.children.find(x=>x.userData.isHealth);if(hpBar)hpBar.lookAt(camera.position);
  if(dist<1.7&&performance.now()-lastDamage>700){damage(8);lastDamage=performance.now();e.position.x-=dx/dist*.35;e.position.z-=dz/dist*.35}
 }
}
function animate(){
 requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.userData.life-=dt;p.position.addScaledVector(p.userData.vel,dt);p.userData.vel.y-=7*dt;p.scale.setScalar(Math.max(.15,p.userData.life*2));if(p.userData.life<=0){scene.remove(p);particles.splice(i,1)}}
 for(let i=tracers.length-1;i>=0;i--){const t=tracers[i];t.userData.life-=dt;if(t.userData.life<=0){scene.remove(t);tracers.splice(i,1)}}

 if(started&&!gameOver&&locked){const dir=new THREE.Vector3();if(move.w)dir.z-=1;if(move.s)dir.z+=1;if(move.a)dir.x-=1;if(move.d)dir.x+=1;if(dir.lengthSq()){dir.normalize();dir.applyAxisAngle(new THREE.Vector3(0,1,0),yaw);camera.position.addScaledVector(dir,7*dt)}camera.position.x=Math.max(-22,Math.min(22,camera.position.x));camera.position.z=Math.max(-22,Math.min(22,camera.position.z));updateEnemies(dt)}
 renderer.render(scene,camera)
}
animate();updateUI();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
